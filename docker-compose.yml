# M3 edge dogfood (s1462) — local HTTP dogfood only.
# dual_write OFF · not Memory GA · still private · binary/image name iomesh-memory-mcp
# image: iomesh-memory-mcp:local  (compose PASS ≠ public registry · build PASS ≠ invent GA)
# Optional path: docker compose up --build — NOT required for make edge-dogfood-gate (offline greps).
# residual PASS ≠ live dogfood · ≠ public flip · ≠ full platform sidecar parity · no aion import
services:
  iomesh-memory-mcp:
    build:
      context: .
      args:
        # Supply when building against private github.com/iome-sh/memory:
        # GH_TOKEN: ${GH_TOKEN:-}
        GH_TOKEN: ${GH_TOKEN:-}
    image: iomesh-memory-mcp:local
    container_name: iomesh-memory-mcp
    ports:
      - "8080:8080"
    environment:
      PALACE_ROOT: /data/memory-palaces
      MEMORY_TENANT: ${MEMORY_TENANT:-default}
      MEMORY_MCP_HTTP_ADDR: ":8080"
      MEMORY_MCP_HTTP_PATH: /mcp
      # Optional advanced embeddings (empty = hash). Mount model + set path for onnx.
      MEMORY_ONNX_MODEL_PATH: ${MEMORY_ONNX_MODEL_PATH:-}
      MEMORY_EMBEDDING_STRICT: ${MEMORY_EMBEDDING_STRICT:-}
      MEMORY_HUGOT_BACKEND: ${MEMORY_HUGOT_BACKEND:-go}
    volumes:
      - palace-data:/data/memory-palaces
      # Optional: mount ONNX model dir when MEMORY_ONNX_MODEL_PATH is set inside the container
      # - ${MEMORY_ONNX_HOST_PATH:-./models}:/models:ro
    # distroless has no curl/wget — probe from host:
    #   curl -fsS http://127.0.0.1:8080/healthz
    restart: unless-stopped

volumes:
  palace-data:
