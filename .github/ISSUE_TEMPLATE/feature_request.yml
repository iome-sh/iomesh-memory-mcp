name: Feature request
description: Propose an improvement to the lean edge Memory MCP host
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep scope lean: a local filesystem palace MCP host. Hosted or
        multi-service features are out of scope for this repository.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What friction exists today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired tool/API/docs change
    validations:
      required: true
  - type: checkboxes
    id: honesty
    attributes:
      label: Honesty
      options:
        - label: This proposal stays within the local filesystem palace host scope
          required: true
