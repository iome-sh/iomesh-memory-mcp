name: Bug report
description: Report a defect in the lean edge Memory MCP host
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Redact palace contents, API keys, and private paths.
        This is a local filesystem palace MCP host.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, flags/env, stdio vs HTTP
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.4.2 or git SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
