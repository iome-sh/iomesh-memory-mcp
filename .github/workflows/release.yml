# Publish multi-platform binaries via GoReleaser when a version tag is pushed.
# Local dry-run: make release-snapshot
#
# Host + kernel (github.com/iome-sh/memory) are PUBLIC — no GOPRIVATE / PAT required
# for release builds (aligned with ci.yml public modules). Historical IOMESH_CI_PAT
# residual retired after public flip.
# Keep GoReleaser + Syft SBOM + keyless cosign (id-token: write) intact.
# residual PASS ≠ invent forever-green signed releases · dual_write OFF ·
# no auto-tag · tip ≠ invent a successful public tag release already shipped.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Run goreleaser snapshot (no GitHub release publish)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Keyless cosign (Fulcio) via GitHub OIDC — no long-lived COSIGN_* secrets.
  id-token: write

env:
  GOTOOLCHAIN: auto

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Public modules: host + github.com/iome-sh/memory — no GOPRIVATE / PAT.
      - name: Module verify (public modules)
        run: |
          set -euo pipefail
          go list -m github.com/iome-sh/memory
          go mod download
          go mod verify

      # Syft generates SPDX SBOMs declared in .goreleaser.yaml (sboms:).
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Cosign keyless sign-blob for checksums (signs: in .goreleaser.yaml).
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: GoReleaser (snapshot)
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          # Snapshot skips signing (no OIDC identity for ad-hoc runs is fine).
          args: release --snapshot --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GoReleaser (tag release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dist (snapshot / debug)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goreleaser-dist
          path: dist/
          retention-days: 7
          if-no-files-found: ignore
