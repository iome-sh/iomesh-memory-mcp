# CI for github.com/iome-sh/iomesh-memory-mcp (lean edge Memory MCP host).
# Required gate: lint · test · build · govulncheck · ci-success.
# Repo remains private until deliberate flip after kernel is public (s1474 readiness).
# residual PASS ≠ public flip.
#
# Private dep residual (github.com/iome-sh/memory):
#   While kernel private → IOMESH_CI_PAT / GH_PAT / GO_MODULE_TOKEN required (repo read on iome-sh/memory).
#   After kernel public  → module fetch is public; PAT optional (keep working config until then).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto
  GOPRIVATE: github.com/iome-sh/*
  GONOSUMDB: github.com/iome-sh/*

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # While kernel private: repo secret IOMESH_CI_PAT (or GH_PAT / GO_MODULE_TOKEN) required.
      # Dependabot PRs do not receive Actions secrets by default — land action bumps via maintainer PR
      # or add the same PAT under Settings → Secrets → Dependabot. After kernel public: PAT optional.
      - name: Configure private Go modules (iome-sh/*)
        env:
          IOMESH_CI_PAT: ${{ secrets.IOMESH_CI_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GO_MODULE_TOKEN: ${{ secrets.GO_MODULE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOKEN="${IOMESH_CI_PAT:-${GH_PAT:-${GO_MODULE_TOKEN:-${GITHUB_TOKEN:-}}}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No token available to fetch private github.com/iome-sh/memory (set IOMESH_CI_PAT)"
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          if ! go list -m github.com/iome-sh/memory; then
            echo "::error::Cannot resolve github.com/iome-sh/memory — token lacks repo read, or Dependabot lacks secrets (use maintainer PR or Dependabot secret)"
            exit 1
          fi

      - name: Module verify
        run: |
          go mod download
          go mod verify

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # While kernel private: repo secret IOMESH_CI_PAT (or GH_PAT / GO_MODULE_TOKEN) required.
      # Dependabot PRs do not receive Actions secrets by default — land action bumps via maintainer PR
      # or add the same PAT under Settings → Secrets → Dependabot. After kernel public: PAT optional.
      - name: Configure private Go modules (iome-sh/*)
        env:
          IOMESH_CI_PAT: ${{ secrets.IOMESH_CI_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GO_MODULE_TOKEN: ${{ secrets.GO_MODULE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOKEN="${IOMESH_CI_PAT:-${GH_PAT:-${GO_MODULE_TOKEN:-${GITHUB_TOKEN:-}}}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No token available to fetch private github.com/iome-sh/memory (set IOMESH_CI_PAT)"
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          if ! go list -m github.com/iome-sh/memory; then
            echo "::error::Cannot resolve github.com/iome-sh/memory — token lacks repo read, or Dependabot lacks secrets (use maintainer PR or Dependabot secret)"
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          go list -m github.com/iome-sh/memory

      - name: go test
        run: go test ./... -count=1 -timeout=10m

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # While kernel private: repo secret IOMESH_CI_PAT (or GH_PAT / GO_MODULE_TOKEN) required.
      # Dependabot PRs do not receive Actions secrets by default — land action bumps via maintainer PR
      # or add the same PAT under Settings → Secrets → Dependabot. After kernel public: PAT optional.
      - name: Configure private Go modules (iome-sh/*)
        env:
          IOMESH_CI_PAT: ${{ secrets.IOMESH_CI_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GO_MODULE_TOKEN: ${{ secrets.GO_MODULE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOKEN="${IOMESH_CI_PAT:-${GH_PAT:-${GO_MODULE_TOKEN:-${GITHUB_TOKEN:-}}}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No token available to fetch private github.com/iome-sh/memory (set IOMESH_CI_PAT)"
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          if ! go list -m github.com/iome-sh/memory; then
            echo "::error::Cannot resolve github.com/iome-sh/memory — token lacks repo read, or Dependabot lacks secrets (use maintainer PR or Dependabot secret)"
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          go list -m github.com/iome-sh/memory

      - name: go build binary
        run: |
          go build ./...
          go build -o /tmp/iomesh-memory-mcp ./cmd/iomesh-memory-mcp

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # While kernel private: repo secret IOMESH_CI_PAT (or GH_PAT / GO_MODULE_TOKEN) required.
      # Dependabot PRs do not receive Actions secrets by default — land action bumps via maintainer PR
      # or add the same PAT under Settings → Secrets → Dependabot. After kernel public: PAT optional.
      - name: Configure private Go modules (iome-sh/*)
        env:
          IOMESH_CI_PAT: ${{ secrets.IOMESH_CI_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GO_MODULE_TOKEN: ${{ secrets.GO_MODULE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOKEN="${IOMESH_CI_PAT:-${GH_PAT:-${GO_MODULE_TOKEN:-${GITHUB_TOKEN:-}}}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No token available to fetch private github.com/iome-sh/memory (set IOMESH_CI_PAT)"
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          if ! go list -m github.com/iome-sh/memory; then
            echo "::error::Cannot resolve github.com/iome-sh/memory — token lacks repo read, or Dependabot lacks secrets (use maintainer PR or Dependabot secret)"
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          go list -m github.com/iome-sh/memory

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  ci-success:
    name: ci-success
    if: always()
    needs: [lint, test, build, govulncheck]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "build=${{ needs.build.result }}"
          echo "govulncheck=${{ needs.govulncheck.result }}"
          for r in \
            "${{ needs.lint.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.govulncheck.result }}"
          do
            if [ "$r" != "success" ]; then
              echo "::error::CI gate failed (got $r)"
              exit 1
            fi
          done
          echo "All required CI jobs passed."
