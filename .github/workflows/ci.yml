# CI for github.com/iome-sh/iomesh-memory-mcp (lean edge Memory MCP host).
# Required gate: lint · test · build · govulncheck · ci-success.
# Repo remains private (s1457); does not flip public.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto
  GOPRIVATE: github.com/iome-sh/*
  GONOSUMDB: github.com/iome-sh/*

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Auth private Go modules (same-org memory kernel)
        env:
          # Prefer org/repo secret with read access to github.com/iome-sh/memory;
          # fall back to GITHUB_TOKEN (works when org grants multi-repo Actions access).
          TOKEN: ${{ secrets.GO_MODULE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Module verify
        run: |
          go mod download
          go mod verify

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Auth private Go modules
        env:
          TOKEN: ${{ secrets.GO_MODULE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: go test
        run: go test ./... -count=1 -timeout=10m

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Auth private Go modules
        env:
          TOKEN: ${{ secrets.GO_MODULE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: go build binary
        run: |
          go build ./...
          go build -o /tmp/iomesh-memory-mcp ./cmd/iomesh-memory-mcp

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Auth private Go modules
        env:
          TOKEN: ${{ secrets.GO_MODULE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  ci-success:
    name: ci-success
    if: always()
    needs: [lint, test, build, govulncheck]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "build=${{ needs.build.result }}"
          echo "govulncheck=${{ needs.govulncheck.result }}"
          for r in \
            "${{ needs.lint.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.govulncheck.result }}"
          do
            if [ "$r" != "success" ]; then
              echo "::error::CI gate failed (got $r)"
              exit 1
            fi
          done
          echo "All required CI jobs passed."
